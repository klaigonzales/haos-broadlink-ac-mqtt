blueprint:
  name: "Broadlink AC Külső Hőmérséklet Szinkronizáló"
  description: >
    Automatikusan szinkronizálja bármely Home Assistant hőmérséklet-érzékelő (pl. Zigbee, Shelly, Sonoff, ESPHome vagy virtuális szenzor)
    értékét a Broadlink klímával MQTT-n keresztül, így a klíma kártyáján ugrálás nélkül a külső hőmérő valós mérése jelenik meg.
  domain: automation
  input:
    temp_sensor:
      name: "Külső Hőmérséklet Érzékelő"
      description: "Válaszd ki azt a helyiség- vagy külső hőmérőt, amit a klímához szeretnél rendelni."
      selector:
        entity:
          filter:
            domain: sensor
            device_class: temperature
    ac_mac:
      name: "Klíma MAC címe vagy Topicja"
      description: "A klíma MAC címe (pl. 34ea34xxxxxx vagy c8f29axxxxxx) vagy a teljes topic (pl. /aircon/34ea34xxxxxx)."
      selector:
        text:
    topic_prefix:
      name: "Topic előtag"
      description: "Az AC MQTT kiegészítőben beállított topic_prefix (alapértelmezett: /aircon)."
      default: "/aircon"
      selector:
        text:

trigger:
  - platform: state
    entity_id: !input temp_sensor

variables:
  ac_mac_input: !input ac_mac
  topic_prefix_input: !input topic_prefix

condition:
  - condition: template
    value_template: "{{ trigger.to_state.state not in ['unavailable', 'unknown', 'none', ''] }}"

action:
  - service: mqtt.publish
    data:
      topic: >-
        {% set raw_mac = (ac_mac_input | string) | replace(':', '') | replace('-', '') | replace(' ', '') | lower %}
        {% set prefix = (topic_prefix_input | string).rstrip('/') %}
        {% if raw_mac.startswith('/') %}
          {{ raw_mac.rstrip('/') }}/current_temp/value
        {% else %}
          {{ prefix }}/{{ raw_mac }}/current_temp/value
        {% endif %}
      payload: "{{ trigger.to_state.state }}"
      retain: true
  - service: mqtt.publish
    data:
      topic: >-
        {% set raw_mac = (ac_mac_input | string) | replace(':', '') | replace('-', '') | replace(' ', '') | lower %}
        {% set prefix = (topic_prefix_input | string).rstrip('/') %}
        {% if raw_mac.startswith('/') %}
          {{ raw_mac.rstrip('/') }}/ext_temp/set
        {% else %}
          {{ prefix }}/{{ raw_mac }}/ext_temp/set
        {% endif %}
      payload: "{{ trigger.to_state.state }}"
      retain: true
mode: restart
